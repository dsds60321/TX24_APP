<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" type="text/css"/>
    <style>
        .layout-split {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: stretch;
        }

        .layout-split__primary,
        .layout-split__secondary {
            flex: 1 1 0;
            min-width: 300px;
        }

        .layout-split__primary {
            display: flex;
            flex-direction: column;
        }

        .layout-split__secondary {
            display: flex;
            flex-direction: column;
        }

        .doc-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .doc-list__row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #fff;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.04);
            flex-wrap: wrap;
        }

        .doc-check {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            color: #0f172a;
        }

        .doc-need {
            margin: 0 0 0 auto;
            font-size: 0.7rem;
            color: #9e9e9e;
            text-align: right;
        }

        .doc-upload-panel {
            margin-top: 0;
            border: 1px dashed #d6def1;
            border-radius: 12px;
            padding: 16px;
            background: #f8faff;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.2s ease, background 0.2s ease;
            flex: 1;
        }

        .doc-upload-panel .dropzone {
            border: none;
            padding: 0;
            background: transparent;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .doc-upload-panel .dropzone.dz-drag-hover,
        .doc-upload-panel .dropzone.is-active {
            border-radius: 12px;
            box-shadow: inset 0 0 0 1px #2563eb;
            background: #e0ecff;
        }

        .doc-upload-panel .dz-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 140px;
            margin: 0;
            text-align: center;
            color: #667085;
        }


        .file-chip-list {
            min-height: 36px;
            border: 1px dashed #d4dbe7;
            border-radius: 10px;
            background: #f8fafc;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
            box-sizing: border-box;
            flex: 1;
            min-height: 100%;
        }

        .file-chip-list.empty {
            align-items: center;
            justify-content: center;
        }

        .file-chip__placeholder {
            color: #94a3b8;
            font-size: 0.82rem;
            margin: 0;
        }

        .file-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            background: #dcfce7;
            color: #166534;
            font-size: 0.8rem;
        }

        .file-chip__remove {
            border: none;
            background: transparent;
            color: inherit;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
        }

        .file-upload-btn {
            position: relative;
            overflow: hidden;
        }

        .file-upload-btn input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

    </style>
</head>
<body>
<div class="row">
    <div class="col-12">
        <div class="pt-2">
            <div th:replace="~{pages/layout/fragments :: maps('고객사 등록')}"></div>

            <form id="merchantForm" class="multi-step-form" onsubmit="return false;">

                <div class="nav-box nav-underline">
                    <div class="tab-nav">
                        <button class="tab-button active" data-tab-target="documents">서류 취합</button>
                        <button class="tab-button" data-tab-target="basic">기본 정보</button>
                        <button class="tab-button" data-tab-target="payment">지급 · 계좌</button>
                    </div>
                    <div class="tab-content">
                        <div class="tab-pane active" id="documents">
                            <div th:replace="~{pages/mcht/detail/file-upload :: mchtFile}"></div>
                        </div>
                        <div class="tab-pane" id="basic">
                            <div th:replace="~{pages/mcht/detail/basic :: mchtBasic}"></div>
                        </div>
                        <div class="tab-pane" id="payment">
                            <div th:replace="~{pages/mcht/detail/payment :: mchtPayment}"></div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>


<div th:replace="~{pages/layout/fragments :: modal('default', 'modal-xl')}"></div>
<script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
<script th:src="@{/assets/js/pages/mcht/view.js}"></script>
</body>
</html>
