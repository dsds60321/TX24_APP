<div th:fragment="mchtBasic">
    <div class="card-group-divider"><span>고객사 정보</span></div>

    <form action="/member/admin/add" id="adminRegisterForm" name="adminRegisterForm" method="POST"
          onsubmit="return false" novalidate="novalidate">

        <div class="card-wrapper edit register-card">
            <div class="card-header d-flex justify-content-between align-items-center flex-wrap">
                <div>
                    <p class="fs-6 fw-bold mb-1">고객사 기본정보</p>
                    <p class="register-lead mb-0">필수 항목을 입력하면 등록 버튼이 활성화됩니다.</p>
                </div>
                <div class="d-flex gap-2">
                    <button type="reset" class="btn btn-grey-outline fs-9 pt-0 pb-0 btn-radius-2">
                        초기화
                    </button>
                    <button type="submit"
                            class="btn btn-blue fs-9 pt-0 pb-0 btn-radius-2 flex-submit  disabled"
                            disabled="">등록
                    </button>
                </div>
            </div>

            <div class="card-contents">
                <div class="card-row m-0 ">
                    <div class="col d-flex form-block">
                        <div class="card-title required"><p class="fs-8 fw-bold">아이디</p></div>
                        <div class="card-txt form-block__body">
                            <div class="form-field">
                                <input type="text" id="id" name="id" class="form-control fs-8"
                                       placeholder="tx_admin01" minlength="4" maxlength="20"
                                       autocomplete="username" value="" required="">
                                <p class="form-hint">영문/숫자 4~20자, 특수문자 제외</p>
                            </div>
                        </div>
                    </div>
                    <div class="col d-flex form-block">
                        <div class="card-title required"><p class="fs-8 fw-bold">상호명</p></div>
                        <div class="card-txt form-block__body">
                            <div class="form-field">
                                <input type="text" id="name" name="name" class="form-control fs-8"
                                       placeholder="" autocomplete="name" value="" required="">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-row m-0 ">
                    <div class="col d-flex form-block">
                        <div class="card-title required"><p class="fs-8 fw-bold">사업자번호</p></div>
                        <div class="card-txt form-block__body">
                            <div class="form-field">
                                <input type="text" id="name" name="name" class="form-control fs-8"
                                       placeholder="" autocomplete="name" value="" required="">
                            </div>
                        </div>
                    </div>
                    <div class="col d-flex form-block">
                        <div class="card-title required"><p class="fs-8 fw-bold">법인등록번호</p></div>
                        <div class="card-txt form-block__body">
                            <div class="form-field">
                                <input type="text" id="name" name="name" class="form-control fs-8"
                                       placeholder="" autocomplete="name" value="" required="">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-row m-0 ">
                    <div class="col d-flex form-block">
                        <div class="card-title required"><p class="fs-8 fw-bold">업종</div>
                        <div class="card-txt form-block__body">
                            <div class="form-field">
                                <input type="text" id="name" name="name" class="form-control fs-8"
                                       placeholder="" autocomplete="name" value="" required="">
                            </div>
                        </div>
                    </div>
                    <div class="col d-flex form-block">
                        <div class="card-title required"><p class="fs-8 fw-bold">업태</p></div>
                        <div class="card-txt form-block__body">
                            <div class="form-field">
                                <input type="text" id="name" name="name" class="form-control fs-8"
                                       placeholder="" autocomplete="name" value="" required="">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-row m-0 ">
                    <div class="col d-flex form-block">
                        <div class="card-title required"><p class="fs-8 fw-bold">홈페이지</p></div>
                        <div class="card-txt form-block__body">
                            <div class="form-field">
                                <div class="input-group">
                                    <input type="text" id="homepageInput" name="name"
                                           class="form-control fs-8 input-action-field"
                                           placeholder="https://example.com" autocomplete="url"
                                           value="" required="">
                                    <button class="btn btn-blue fs-9 pt-0 pb-0 btn-radius-2">홈페이지 확인</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>


    <div class="card-group-divider"><span>기본 정보</span></div>

    <div class="common-render" data-url="/person/ubo/list/tmp" data-target="person-ubo-view">
        <div class="card-wrapper p-2" id="person-ubo-view">
            대표자 렌더링에 실패했습니다.
        </div>
    </div>

    <div class="common-render" data-url="/addr/list/tmp" data-target="addr-view">
        <div class="card-wrapper p-2" id="addr-view">
            주소지 렌더링에 실패했습니다.
        </div>
    </div>

    <div class="common-render" data-url="/person/list/연대보증/tmp" data-target="person-연대보증-view">
        <div class="card-wrapper p-2" id="person-연대보증-view">
            연대보증인 렌더링에 실패했습니다.
        </div>
    </div>

    <!-- 채널 담당자 생성 -->
    <div class="common-render" data-url="/person/list/채널/temp" data-target="person-channel-list">
        <div class="card-wrapper p-2" id="person-channel-list">
            채널 담당자 렌더링에 실패했습니다.
        </div>
    </div>
</div>
